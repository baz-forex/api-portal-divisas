definitions:
  GenericRequest:
    type: object
    description: Cuerpo de petición SCIM o estructura no modelada explícitamente.
    additionalProperties: true
  ScimResourceRequest:
    type: object
    description: Recurso SCIM enviado en operaciones POST y PUT.
    additionalProperties: true
    properties:
      schemas:
        type: array
        description: URN de los esquemas SCIM aplicables.
        items:
          type: string
      id:
        type: string
        description: Identificador del recurso SCIM.
      externalId:
        type: string
        description: Identificador externo del recurso.
      userName:
        type: string
        description: Nombre de usuario SCIM.
      displayName:
        type: string
        description: Nombre visible del recurso.
      name:
        type: object
        additionalProperties: true
      active:
        type: boolean
        description: Indica si el recurso está activo.
      emails:
        type: array
        items:
          type: object
          additionalProperties: true
    required:
    - schemas
  ScimPatchRequest:
    type: object
    description: Documento SCIM PatchOp enviado en operaciones PATCH.
    additionalProperties: true
    properties:
      schemas:
        type: array
        items:
          type: string
      Operations:
        type: array
        items:
          "$ref": "#/definitions/ScimPatchOperation"
    required:
    - schemas
    - Operations
  ScimPatchOperation:
    type: object
    properties:
      op:
        type: string
        description: Operación add, remove o replace.
        enum:
        - add
        - remove
        - replace
      path:
        type: string
        description: Ruta SCIM del atributo a modificar.
      value:
        type: object
        description: Valor de la operación.
        x-nullable: true
    required:
    - op
  ScimBulkRequest:
    type: object
    description: Documento SCIM BulkRequest enviado al endpoint de operaciones masivas.
    additionalProperties: true
    properties:
      schemas:
        type: array
        items:
          type: string
      Operations:
        type: array
