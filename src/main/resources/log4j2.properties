name = LogAppConfig

# JBoss
property.filename = ${sys:jboss.server.log.dir:-logs}/APIPortalDivisasLog.log

property.layoutPatternConsole = {\"log_data\":{\"fecha\":\"%d{yyyy-MM-dd HH:mm:ss.SSS-SSSS}\",\"Level\":\"%p\",\"Mensaje\":\"%m\"}}%n
property.layoutPattern = {\"log_data\":{\"fecha\":\"%d{yyyy-MM-dd HH:mm:ss.SSS-SSSS}\",\"Level\":\"%p\",\"Mensaje\":\"%m\"}}%n


appenders = console, rolling

appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = ${layoutPatternConsole}

appender.rolling.type = RollingFile
appender.rolling.name = RollingFile
appender.rolling.fileName = ${filename}
appender.rolling.filePattern = ${filename}.%d{yyyy-MM-dd}
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = ${layoutPattern}
appender.rolling.policies.type = Policies
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 1
appender.rolling.policies.time.modulate = true

logger.app.name = apiPortalDivisas
logger.app.level = INFO
logger.app.appenderRefs = rolling
#logger.app.appenderRefs = rolling, stdout
logger.app.appenderRef.rolling.ref = RollingFile
#logger.app.appenderRef.stdout.ref = STDOUT
logger.app.additivity = false

rootLogger.level = INFO
rootLogger.appenderRefs = stdout
rootLogger.appenderRef.stdout.ref = STDOUT
